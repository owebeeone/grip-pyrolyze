[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grip-pyrolyze"
version = "0.1.0"
authors = [
    { name = "Gianni Mariani", email = "gianni@mariani.ws" },
]
description = "GRIP integration and helpers for PyRolyze."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
]
dependencies = [
  "grip-py",
  "pyrolyze",
]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
grip-py = { path = "../grip-py", editable = true }
pyrolyze = { path = "../pyrolyze", editable = true }

[project.urls]
Homepage = "https://github.com/owebeeone/grip-pyrolyze"
"Bug Tracker" = "https://github.com/owebeeone/grip-pyrolyze/issues"

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grip_pyrolyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
